<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Word Counter</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; width: 90%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    textarea { width: 100%; height: 140px; box-sizing: border-box; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; padding: 12px; font-size: 1rem; resize: none; outline: none; margin-top: 1rem; }
    .stats { display: flex; gap: 1rem; margin-top: 1rem; }
    .stat-box { flex: 1; background: #334155; padding: 0.75rem; border-radius: 8px; text-align: center; }
    .stat-box span { display: block; font-size: 1.5rem; font-weight: bold; color: #38bdf8; }
  </style>
</head>
<body>
  <div class="card">
    <h2>⚡ Word Counter Pro</h2>
    <textarea id="text-input" placeholder="Type or paste text here..."></textarea>
    <div class="stats">
      <div class="stat-box"><span id="word-count">0</span>Words</div>
      <div class="stat-box"><span id="char-count">0</span>Characters</div>
    </div>
  </div>
  <script>
    const input = document.getElementById('text-input');
    const words = document.getElementById('word-count');
    const chars = document.getElementById('char-count');

    input.addEventListener('input', () => {
      const val = input.value.trim();
      chars.textContent = input.value.length;
      words.textContent = val ? val.split(/\s+/).length : 0;
    });
  </script>
</body>
</html>
